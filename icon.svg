        fill="none" stroke="#7c8794" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M11 18.5c1.4-2 3.2-3 5-3s3.6 1 5 3c-1.4 2-3.2 3-5 3s-3.6-1-5-3z"
        fill="none" stroke="#7c8794" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="16" cy="18.5" r="1.7" fill="#e5484d"/>
</svg>
